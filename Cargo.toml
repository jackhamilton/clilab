[package]
name = "cli-builder"
version = "2.0.0"
edition = "2024"
license = "Unlicense"
authors = ["Jack Hamilton jackham800@gmail.com"]
keywords = ["cli", "macro"]
categories = ["command-line-interface"]
repository = "https://github.com/jackhamilton/cli-builder-macros"
description = "Macro to make cli creation easy. Also generates commands for help, version, and zsh completions."

[workspace]
members = ["crates/cli-builder-macros", "crates/example-cli"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "Unlicense"
authors = ["Jack Hamilton jackham800@gmail.com"]
keywords = []
categories = []
repository = "https://github.com/jackhamilton/cli-builder-macros"
description = "Support crate for cli-builder"

[dependencies]
cli-builder-macros = { version = "~2", path = "crates/cli-builder-macros" }
owo-colors = "4.4.0"

[workspace.dependencies]
owo-colors = "4.4.0"
